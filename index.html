<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abu Z00Z - Neon Browser</title>
    <style>
        /* إعدادات الخلفية العامة */
        body {
            margin: 0;
            padding: 0;
            background-color: #08080c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }

        /* الاسم الرئيسي - توهج ثابت بدون وميض */
        .neon-title {
            font-size: 4rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
            text-shadow: 
                0 0 7px #fff,
                0 0 15px #00d2ff,
                0 0 30px #00d2ff,
                0 0 60px #00d2ff;
        }

        /* أدوات التحكم (رجوع / أمام) وشريط التبويبات */
        .browser-tools {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #00d2ff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            margin-bottom: 15px;
            gap: 10px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #ff007f;
            color: #ff007f;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
        }

        .nav-btn:hover {
            background: #ff007f;
            color: #000;
            box-shadow: 0 0 15px #ff007f;
        }

        /* شريط التبويبات */
        .tabs-container {
            display: flex;
            gap: 8px;
            flex-grow: 1;
            overflow-x: auto;
        }

        .tab {
            display: flex;
            align-items: center;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d2ff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .tab .close-tab {
            margin-right: 8px;
            cursor: pointer;
            color: #ff007f;
            font-weight: bold;
            transition: 0.2s;
        }

        .tab .close-tab:hover {
            color: #ff55aa;
            transform: scale(1.2);
        }

        /* شريط البحث */
        .search-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            background: #12121a;
            border: 2px solid #00d2ff;
            border-radius: 30px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            transition: 0.3s;
        }

        .search-input:focus {
            box-shadow: 0 0 25px #00d2ff;
            background: #161622;
        }

        .search-btn {
            position: absolute;
            left: 5px;
            top: 5px;
            bottom: 5px;
            background: #00d2ff;
            border: none;
            color: #000;
            padding: 0 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        /* اختصارات التطبيقات */
        .shortcuts-title {
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
        }

        .shortcut-card {
            background: #12121a;
            border: 1px solid #ff007f;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .shortcut-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px #ff007f;
            background: #ff007f;
            color: #000;
        }

        .shortcut-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
            display: block;
        }

        /* تسجيل الدخول باستخدام جوجل */
        .google-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: auto; /* يدفع العناصر التالية للأسفل */
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .google-btn:hover {
            background: #000;
            color: #fff;
            border-color: #00d2ff;
            box-shadow: 0 0 15px #00d2ff;
        }

        /* النص السفلي */
        .footer-text {
            font-size: 1.5rem;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            margin-top: 40px;
            letter-spacing: 1px;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- الاسم الرئيسي (ثابت ونيون فاقع) -->
    <h1 class="neon-title">Abu Z00Z</h1>

    <!-- شريط أدوات المتصفح والتبويبات -->
    <div class="browser-tools">
        <button class="nav-btn" onclick="history.back()">→ للخلف</button>
        <button class="nav-btn" onclick="history.forward()">← للأمام</button>
        
        <div class="tabs-container">
            <div class="tab" id="tab1">
                <span>الرئيسية</span>
            </div>
            <div class="tab" id="tab2">
                <span class="close-tab" onclick="document.getElementById('tab2').style.display='none'">✕</span>
                <span>بحث Google</span>
            </div>
            <div class="tab" id="tab3">
                <span class="close-tab" onclick="document.getElementById('tab3').style.display='none'">✕</span>
                <span>الألعاب</span>
            </div>
        </div>
    </div>

    <!-- شريط البحث - يفتح النتيجة في علامة تبويب جديدة طلقاءً -->
    <div class="search-container">
        <form action="https://www.google.com/search" method="GET" target="_blank" class="search-form">
            <input type="text" name="q" class="search-input" placeholder="ابحث في الإنترنت عبر Abu Z00Z..." required>
            <button type="submit" class="search-btn">بحث</button>
        </form>
    </div>

    <!-- اختصارات التطبيقات -->
    <div class="shortcuts-title">الوصول السريع</div>
    <div class="shortcuts-grid">
        <a href="https://www.youtube.com" target="_blank" class="shortcut-card">
            <span class="shortcut-icon">📺</span> يوتيوب
        </a>
        <a href="https://www.discord.com" target="_blank" class="shortcut-card">
            <span class="shortcut-icon">💬</span> ديسكورد
        </a>
        <a href="https://github.com" target="_blank" class="shortcut-card">
            <span class="shortcut-icon">💻</span> جيتهاب
        </a>
        <a href="https://www.google.com" target="_blank" class="shortcut-card">
            <span class="shortcut-icon">🔍</span> جوجل
        </a>
    </div>

    <!-- زر تسجيل الدخول بجوجل -->
    <a href="https://accounts.google.com" target="_blank" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.6 8.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8c-.2 1.1-.8 2-1.8 2.6v2.2h2.9c1.7-1.6 2.7-4 2.7-6.4z"/>
            <path fill="#34A853" d="M9 17c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.8-3.1.8-2.4 0-4.4-1.6-5.1-3.8H.9v2.3C2.4 14.8 5.5 17 9 17z"/>
            <path fill="#FBBC05" d="M3.9 9.6c-.2-.6-.3-1.2-.3-1.8s.1-1.2.3-1.8V3.7H.9C.3 4.9 0 6.3 0 7.8s.3 2.9.9 4.1l3-2.3z"/>
            <path fill="#EA4335" d="M9 3.4c1.3 0 2.5.5 3.4 1.3l2.6-2.6C13.4.8 11.4 0 9 0 5.5 0 2.4 2.2.9 5.2l3 2.3c.7-2.2 2.7-4 5.1-4z"/>
        </svg>
        Sign in with Google
    </a>

    <!-- العبارة السفلية -->
    <div class="footer-text">تصفح بارتياح</div>

</body>
</html>
